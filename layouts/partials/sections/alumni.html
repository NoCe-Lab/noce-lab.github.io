<div class="container-fluid anchor pb-5 alumni-section">
  <h1 class="text-center"><span id="{{ .section.id }}"></span>{{ .section.name }}</h1>
  <div class="container">
    <ul>
      {{ range .alumni }}
        <li>{{ .name }}, {{ .degree }} ({{ .years }})</li>
      {{ end }}
    </ul>
  </div>
</div>
